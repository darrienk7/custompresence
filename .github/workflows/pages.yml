name: Publish policy pages

on:
  push:
    branches: [main]
    paths:
      - custompresence/assets/legal/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: custompresence/assets/legal
      - name: Deploy policies
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show Discord application links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Terms of Service: %sterms.html\n\nPrivacy Policy: %sprivacy.html\n' "$PAGE_URL" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
